name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Floating `.x` is load-bearing, not laziness. `engines.node` for the
      # published server is `>=20`, but the dev toolchain floor is higher:
      # ESLint 10 declares `^20.19.0 || ^22.13.0 || >=24`. Asking for the
      # newest patch of each line satisfies that; pinning either leg to an
      # exact older patch (say `20.9.0`) breaks `npm run lint` while the
      # server itself still runs there perfectly well. See the `eslint` row
      # under "Tech stack pinning" in CLAUDE.md before narrowing this.
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - name: Verify dist/index.js shebang and exec bit
        run: |
          test -x dist/index.js
          head -n 1 dist/index.js | grep -q '^#!/usr/bin/env node$'
      - if: always() && matrix.node == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
